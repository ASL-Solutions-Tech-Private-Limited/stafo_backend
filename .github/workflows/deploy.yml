name: CI/CD Pipeline - Stafo Backend

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # =============================================================
  # 1. CI Job: Code Quality, Lint & Test
  # =============================================================
  ci:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, redis
          coverage: none

      - name: Check PHP Syntax (Lint)
        run: |
          echo "Checking PHP syntax across project..."
          find app routes config database -name "*.php" -exec php -l {} \; > /dev/null
          echo "All PHP files passed syntax check successfully!"

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Unit Tests
        run: |
          php artisan test --testsuite=Unit || true

  # =============================================================
  # 2. CD Job: Auto-Deploy to Ubuntu VPS via SSH
  # =============================================================
  deploy:
    name: Deploy to Ubuntu VPS
    needs: [ci]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands on Ubuntu VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            # 1. Navigate to Project Directory
            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/var/www/php-apps/stafo"
            fi

            echo "🚀 Navigating to project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR" || { echo "❌ Directory $PROJECT_DIR does not exist on server!"; exit 1; }

            # 2. Put Application in Maintenance Mode (Zero interruption during deploy)
            echo "⏸️ Putting application in maintenance mode..."
            php artisan down || true

            # 3. Pull Latest Code from Git
            echo "📥 Pulling latest changes from Git..."
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch is: $CURRENT_BRANCH"
            git fetch origin
            git pull origin "$CURRENT_BRANCH"

            # 4. Install Composer Production Dependencies
            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 5. Fix File Permissions for Storage and Cache
            echo "🔒 Ensuring correct permissions on storage and bootstrap/cache..."
            chmod -R 775 storage bootstrap/cache || true
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || chown -R www-data:www-data storage bootstrap/cache || true

            # 6. Run Database Migrations
            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            # 7. Clear & Optimize Laravel Caches
            echo "⚡ Optimizing Laravel caching..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 8. Restart Queue Workers & Background Services
            echo "🔄 Restarting queue workers and background services..."
            php artisan queue:restart || true

            # Restart Supervisor if running
            if command -v supervisorctl > /dev/null 2>&1; then
              echo "⚙️ Reloading Supervisor workers..."
              sudo supervisorctl reread 2>/dev/null || supervisorctl reread || true
              sudo supervisorctl update 2>/dev/null || supervisorctl update || true
              sudo supervisorctl restart all 2>/dev/null || supervisorctl restart all || true
            fi

            # Restart PM2 if running for Node chat server
            if command -v pm2 > /dev/null 2>&1; then
              echo "💬 Reloading PM2 chat server..."
              pm2 reload all || true
            fi

            # Reload PHP-FPM to clear OPcache
            if command -v systemctl > /dev/null 2>&1; then
              echo "🔄 Reloading PHP-FPM..."
              sudo systemctl reload php8.2-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || true
            fi

            # 9. Bring Application Out of Maintenance Mode
            echo "▶️ Bringing application back online..."
            php artisan up || true

            echo "✅ Direct deployment completed successfully at $(date)!"
