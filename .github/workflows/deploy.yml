name: Deploy to Ubuntu VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Ubuntu VPS via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          # 1. Validate Required Secrets
          MISSING_SECRETS=""
          if [ -z "$SERVER_HOST" ]; then MISSING_SECRETS="$MISSING_SECRETS SERVER_HOST"; fi
          if [ -z "$SERVER_USER" ]; then MISSING_SECRETS="$MISSING_SECRETS SERVER_USER"; fi
          if [ -z "$SERVER_SSH_KEY" ]; then MISSING_SECRETS="$MISSING_SECRETS SERVER_SSH_KEY"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ ERROR: The following required GitHub Secrets are MISSING or EMPTY:$MISSING_SECRETS"
            echo ""
            echo "👉 How to fix:"
            echo "1. Go to your GitHub Repository: https://github.com/ASL-Solutions-Tech-Private-Limited/stafo_backend"
            echo "2. Click 'Settings' (top menu) -> 'Secrets and variables' (left sidebar) -> 'Actions'"
            echo "3. Under 'Repository secrets', make sure these are added with the exact names:"
            echo "   - SERVER_HOST      (your VPS IP, e.g. 123.45.67.89)"
            echo "   - SERVER_USER      (your VPS username, e.g. ubuntu or root)"
            echo "   - SERVER_SSH_KEY   (your private SSH key)"
            echo "   (Note: Do NOT add them under 'Environments', add them under 'Repository secrets')"
            exit 1
          fi

          echo "🔐 Configuring SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private SSH key from GitHub Secrets
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Set default port 22 if not specified
          PORT="${SERVER_PORT:-22}"

          # Add remote server to known_hosts to prevent interactive prompt
          echo "🌐 Adding $SERVER_HOST to known_hosts on port $PORT..."
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Target project directory on VPS
          TARGET_DIR="${SERVER_PROJECT_PATH:-/var/www/php-apps/stafo}"
          BRANCH_NAME="${TARGET_BRANCH:-master}"

          echo "🚀 Executing deployment on $SERVER_USER@$SERVER_HOST for branch: $BRANCH_NAME..."
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo '📁 Navigating to project directory: $TARGET_DIR'
            cd $TARGET_DIR || exit 1

            echo '⏸️ Putting application in maintenance mode...'
            php artisan down || true

            echo '📥 Pulling latest code for branch: $BRANCH_NAME...'
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME origin/$BRANCH_NAME
            git pull origin $BRANCH_NAME

            echo '📦 Installing composer dependencies...'
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

            echo '🔒 Ensuring permissions...'
            chmod -R 775 storage bootstrap/cache || true
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true

            echo '🗄️ Running migrations...'
            php artisan migrate --force

            echo '⚡ Optimizing caches...'
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo '🔄 Restarting queue...'
            php artisan queue:restart || true

            if command -v supervisorctl > /dev/null 2>&1; then
              echo '⚙️ Reloading Supervisor...'
              sudo supervisorctl reread 2>/dev/null || true
              sudo supervisorctl update 2>/dev/null || true
              sudo supervisorctl restart all 2>/dev/null || true
            fi

            if command -v pm2 > /dev/null 2>&1; then
              echo '💬 Reloading PM2...'
              pm2 reload all 2>/dev/null || true
            fi

            if command -v systemctl > /dev/null 2>&1; then
              echo '🔄 Reloading PHP-FPM...'
              sudo systemctl reload php8.2-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || true
            fi

            echo '▶️ Bringing application back online...'
            php artisan up || true

            echo '🎉 Deployment completed successfully!'
          "

          echo "✅ Deployment finished successfully!"
